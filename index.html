<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Mobility Hunter</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: #111;
}
video {
    position: absolute;
    transform: scaleX(-1);
    width: 100vw;
    height: 100vh;
    object-fit: cover;
}
canvas {
    position: absolute;
    top: 0;
    left: 0;
}
#score {
    position: absolute;
    top: 20px;
    left: 20px;
    color: white;
    font-size: 32px;
}
</style>
</head>
<body>

<video id="video" autoplay playsinline></video>
<canvas id="canvas"></canvas>
<div id="score">0</div>

<script type="module">

import {
PoseLandmarker,
FilesetResolver
} from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest";

const video = document.getElementById("video");
const canvas = document.getElementById("canvas");
const ctx = canvas.getContext("2d");

let score = 0;

const orb = {
    x: Math.random()*800 + 100,
    y: Math.random()*400 + 100,
    r: 40
};

navigator.mediaDevices.getUserMedia({
    video: true
}).then(stream=>{
    video.srcObject = stream;
});

const vision = await FilesetResolver.forVisionTasks(
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@latest/wasm"
);

const poseLandmarker =
await PoseLandmarker.createFromOptions(vision,{
    baseOptions:{
        modelAssetPath:
"https://storage.googleapis.com/mediapipe-models/pose_landmarker/full/float16/1/pose_landmarker.task"
    },
    runningMode:"VIDEO",
    numPoses:1
});

function spawnOrb(){
    orb.x = Math.random()*window.innerWidth;
    orb.y = Math.random()*window.innerHeight;
}

function gameLoop(){

    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;

    ctx.clearRect(0,0,canvas.width,canvas.height);

    ctx.fillStyle="gold";
    ctx.beginPath();
    ctx.arc(orb.x,orb.y,orb.r,0,Math.PI*2);
    ctx.fill();

    const result =
    poseLandmarker.detectForVideo(video,performance.now());

    if(result.landmarks.length){

        const lm = result.landmarks[0];

        const rightHand = lm[20];

        const x = (1-rightHand.x)*canvas.width;
        const y = rightHand.y*canvas.height;

        ctx.fillStyle="cyan";
        ctx.beginPath();
        ctx.arc(x,y,20,0,Math.PI*2);
        ctx.fill();

        const dx = x-orb.x;
        const dy = y-orb.y;
        const dist = Math.sqrt(dx*dx+dy*dy);

        if(dist < orb.r+20){
            score++;
            document.getElementById("score").innerText=score;
            spawnOrb();
        }
    }

    requestAnimationFrame(gameLoop);
}

video.addEventListener("loadeddata",gameLoop);

</script>
</body>
</html>
