<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
  />
  <meta name="theme-color" content="#07101d" />
  <title>Mobility Hunter</title>

  <style>
    :root {
      color-scheme: dark;
      font-family:
        Inter, system-ui, -apple-system, BlinkMacSystemFont,
        "Segoe UI", sans-serif;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      margin: 0;
      overflow: hidden;
      background: #07101d;
    }

    body {
      min-height: 100dvh;
    }

    #video,
    #canvas {
      position: absolute;
      inset: 0;
      width: 100vw;
      height: 100dvh;
    }

    #video {
      z-index: 1;
      object-fit: cover;
      transform: scaleX(-1);
      filter:
        brightness(0.72)
        contrast(1.08)
        saturate(0.9)
        hue-rotate(165deg);
    }

    #canvas {
      z-index: 2;
      pointer-events: none;
    }

    .scanlines {
      position: absolute;
      z-index: 3;
      inset: 0;
      pointer-events: none;
      opacity: 0.35;
      background:
        repeating-linear-gradient(
          to bottom,
          rgba(255, 255, 255, 0.018) 0,
          rgba(255, 255, 255, 0.018) 1px,
          transparent 1px,
          transparent 4px
        );
    }

    .vignette {
      position: absolute;
      z-index: 3;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(
          ellipse at center,
          transparent 38%,
          rgba(0, 0, 0, 0.2) 73%,
          rgba(0, 0, 0, 0.65) 100%
        );
    }

    #hud {
      position: absolute;
      z-index: 4;
      top: max(16px, env(safe-area-inset-top));
      left: 16px;
      display: grid;
      gap: 8px;
      pointer-events: none;
      text-shadow: 0 2px 10px rgba(0, 0, 0, 0.9);
    }

    .hud-card {
      width: max-content;
      padding: 9px 12px;
      border: 1px solid rgba(107, 237, 255, 0.3);
      border-radius: 10px;
      background: rgba(1, 12, 31, 0.7);
      backdrop-filter: blur(10px);
    }

    .hud-card span {
      display: block;
      color: #85efff;
      font-size: 10px;
      font-weight: 800;
      letter-spacing: 0.12em;
    }

    .hud-card strong {
      display: block;
      margin-top: 2px;
      color: #f2ffff;
      font-size: 28px;
      line-height: 1;
    }

    #tracking {
      color: #c9e1f4;
      font-size: 12px;
      font-weight: 700;
    }

    #message {
      position: absolute;
      z-index: 5;
      bottom: max(22px, calc(env(safe-area-inset-bottom) + 12px));
      left: 50%;
      max-width: calc(100vw - 36px);
      padding: 10px 15px;
      border: 1px solid rgba(110, 229, 255, 0.28);
      border-radius: 999px;
      background: rgba(2, 12, 32, 0.78);
      color: #eaffff;
      font-size: 13px;
      font-weight: 800;
      text-align: center;
      transform: translateX(-50%);
      backdrop-filter: blur(10px);
    }

    #start-screen {
      position: absolute;
      z-index: 10;
      inset: 0;
      display: grid;
      place-items: center;
      padding: 20px;
      background: rgba(1, 7, 20, 0.5);
      backdrop-filter: blur(5px);
    }

    #start-panel {
      width: min(100%, 390px);
      padding: 25px;
      border: 1px solid rgba(106, 232, 255, 0.28);
      border-radius: 20px;
      background:
        linear-gradient(
          145deg,
          rgba(15, 51, 89, 0.95),
          rgba(2, 9, 26, 0.96)
        );
      box-shadow: 0 24px 70px rgba(0, 0, 0, 0.65);
      text-align: center;
    }

    #start-panel p:first-child {
      margin: 0;
      color: #7eeeff;
      font-size: 10px;
      font-weight: 900;
      letter-spacing: 0.16em;
    }

    #start-panel h1 {
      margin: 9px 0;
      color: #f2ffff;
      font-size: clamp(34px, 10vw, 46px);
      letter-spacing: -0.05em;
    }

    #start-panel p:not(:first-child) {
      margin: 0 0 20px;
      color: #b9d0e6;
      font-size: 14px;
      line-height: 1.5;
    }

    #start-button {
      width: 100%;
      padding: 14px;
      border: 0;
      border-radius: 12px;
      background: linear-gradient(135deg, #4cf0db, #5ba8ff);
      color: #041222;
      cursor: pointer;
      font-size: 15px;
      font-weight: 900;
      letter-spacing: 0.03em;
      box-shadow: 0 8px 28px rgba(68, 211, 255, 0.28);
    }

    #start-button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>

<body>
  <video id="video" autoplay muted playsinline></video>
  <canvas id="canvas"></canvas>

  <div class="scanlines"></div>
  <div class="vignette"></div>

  <section id="hud">
    <div class="hud-card">
      <span>MOBILITY SCORE</span>
      <strong id="score">0</strong>
    </div>

    <div class="hud-card">
      <span>TRACKING</span>
      <div id="tracking">Waiting for camera…</div>
    </div>
  </section>

  <div id="message">Collect the gold energy orb with your right hand.</div>

  <section id="start-screen">
    <div id="start-panel">
      <p>MOTION TRACKING GAME</p>
      <h1>Mobility Hunter</h1>
      <p>
        Move your right hand to collect energy orbs. Keep your upper body
        visible and use good lighting for the strongest tracking.
      </p>
      <button id="start-button">Start Camera</button>
    </div>
  </section>

  <script type="module">
    import {
      PoseLandmarker,
      FilesetResolver
    } from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22";

    const video = document.querySelector("#video");
    const canvas = document.querySelector("#canvas");
    const ctx = canvas.getContext("2d");

    const scoreElement = document.querySelector("#score");
    const trackingElement = document.querySelector("#tracking");
    const messageElement = document.querySelector("#message");
    const startScreen = document.querySelector("#start-screen");
    const startButton = document.querySelector("#start-button");

    const RIGHT_INDEX_FINGER_TIP = 20;
    const ORB_RADIUS = 38;
    const HAND_RADIUS = 20;

    let poseLandmarker = null;
    let score = 0;
    let lastVideoTime = -1;
    let lastDetection = null;
    let animationFrameId = null;

    const orb = {
      x: 0,
      y: 0,
      radius: ORB_RADIUS,
      pulse: 0,
      collectedAt: 0
    };

    const particles = [];

    function resizeCanvas() {
      const dpr = Math.min(window.devicePixelRatio || 1, 2);

      canvas.width = Math.floor(window.innerWidth * dpr);
      canvas.height = Math.floor(window.innerHeight * dpr);

      canvas.style.width = `${window.innerWidth}px`;
      canvas.style.height = `${window.innerHeight}px`;

      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    }

    function spawnOrb() {
      const safeTop = 130;
      const safeBottom = 110;
      const padding = ORB_RADIUS + 22;

      orb.x =
        padding +
        Math.random() * (window.innerWidth - padding * 2);

      orb.y =
        safeTop +
        Math.random() *
          Math.max(
            60,
            window.innerHeight - safeTop - safeBottom
          );

      orb.pulse = 0;
    }

    function addParticles(x, y) {
      for (let index = 0; index < 22; index += 1) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 60 + Math.random() * 220;

        particles.push({
          x,
          y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed,
          life: 520 + Math.random() * 220,
          maxLife: 740,
          size: 2 + Math.random() * 4
        });
      }
    }

    function updateParticles(deltaMs) {
      const dt = deltaMs / 1000;

      for (const particle of particles) {
        particle.x += particle.vx * dt;
        particle.y += particle.vy * dt;
        particle.vx *= 0.985;
        particle.vy *= 0.985;
        particle.life -= deltaMs;
      }

      while (particles.length && particles[0].life <= 0) {
        particles.shift();
      }

      for (let index = particles.length - 1; index >= 0; index -= 1) {
        if (particles[index].life <= 0) {
          particles.splice(index, 1);
        }
      }
    }

    function drawParticles() {
      for (const particle of particles) {
        const alpha = Math.max(
          0,
          particle.life / particle.maxLife
        );

        ctx.save();
        ctx.globalAlpha = alpha;
        ctx.fillStyle = "#ffe66b";
        ctx.beginPath();
        ctx.arc(
          particle.x,
          particle.y,
          particle.size,
          0,
          Math.PI * 2
        );
        ctx.fill();
        ctx.restore();
      }
    }

    function drawOrb(timestamp) {
      orb.pulse = Math.sin(timestamp / 180) * 5;

      const glow = ctx.createRadialGradient(
        orb.x,
        orb.y,
        2,
        orb.x,
        orb.y,
        orb.radius * 2.4
      );

      glow.addColorStop(0, "#ffffff");
      glow.addColorStop(0.22, "#fff9bc");
      glow.addColorStop(0.5, "#ffd84d");
      glow.addColorStop(1, "rgba(255, 193, 31, 0)");

      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(
        orb.x,
        orb.y,
        orb.radius * 2.4 + orb.pulse,
        0,
        Math.PI * 2
      );
      ctx.fill();

      ctx.fillStyle = "#ffe668";
      ctx.beginPath();
      ctx.arc(
        orb.x,
        orb.y,
        orb.radius + orb.pulse * 0.25,
        0,
        Math.PI * 2
      );
      ctx.fill();

      ctx.strokeStyle = "rgba(255, 255, 255, 0.9)";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(
        orb.x,
        orb.y,
        orb.radius + 5 + orb.pulse * 0.25,
        0,
        Math.PI * 2
      );
      ctx.stroke();
    }

    function drawHand(x, y) {
      const glow = ctx.createRadialGradient(
        x,
        y,
        1,
        x,
        y,
        HAND_RADIUS * 2.5
      );

      glow.addColorStop(0, "#ffffff");
      glow.addColorStop(0.25, "#d5ffff");
      glow.addColorStop(0.55, "#3cf0ff");
      glow.addColorStop(1, "rgba(60, 240, 255, 0)");

      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(x, y, HAND_RADIUS * 2.5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#caffff";
      ctx.beginPath();
      ctx.arc(x, y, HAND_RADIUS, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#eeffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(x, y, HAND_RADIUS + 4, 0, Math.PI * 2);
      ctx.stroke();
    }

    function updateTrackingText(result) {
      if (!result?.landmarks?.length) {
        trackingElement.textContent = "No body detected";
        trackingElement.style.color = "#ffb2bb";
        return;
      }

      const landmarks = result.landmarks[0];

      const nose = landmarks[0];
      const leftShoulder = landmarks[11];
      const rightShoulder = landmarks[12];

      const confidence =
        ((nose?.visibility ?? 0) +
          (leftShoulder?.visibility ?? 0) +
          (rightShoulder?.visibility ?? 0)) /
        3;

      const percentage = Math.round(confidence * 100);

      trackingElement.textContent = `${percentage}% body lock`;
      trackingElement.style.color =
        confidence > 0.5 ? "#baffdc" : "#ffcf91";
    }

    function getRightIndexPosition(result) {
      if (!result?.landmarks?.length) return null;

      const landmarks = result.landmarks[0];
      const rightIndex = landmarks[RIGHT_INDEX_FINGER_TIP];

      if (!rightIndex) return null;

      const visibility = rightIndex.visibility ?? 1;

      if (visibility < 0.35) return null;

      return {
        x: (1 - rightIndex.x) * window.innerWidth,
        y: rightIndex.y * window.innerHeight
      };
    }

    function checkOrbCollection(hand) {
      if (!hand) return;

      const dx = hand.x - orb.x;
      const dy = hand.y - orb.y;
      const distance = Math.hypot(dx, dy);

      if (distance > orb.radius + HAND_RADIUS) return;

      score += 1;
      scoreElement.textContent = score;

      addParticles(orb.x, orb.y);
      spawnOrb();

      messageElement.textContent =
        score % 10 === 0
          ? `Combo milestone: ${score} energy orbs collected!`
          : "+1 Energy Orb";
    }

    async function loadPoseLandmarker() {
      const vision = await FilesetResolver.forVisionTasks(
        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm"
      );

      poseLandmarker =
        await PoseLandmarker.createFromOptions(vision, {
          baseOptions: {
            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task",
            delegate: "GPU"
          },
          runningMode: "VIDEO",
          numPoses: 1,
          minPoseDetectionConfidence: 0.55,
          minPosePresenceConfidence: 0.55,
          minTrackingConfidence: 0.55
        });
    }

    async function startCamera() {
      if (!navigator.mediaDevices?.getUserMedia) {
        throw new Error("Camera access is not supported in this browser.");
      }

      const stream = await navigator.mediaDevices.getUserMedia({
        audio: false,
        video: {
          facingMode: "user",
          width: { ideal: 1280 },
          height: { ideal: 720 },
          frameRate: { ideal: 30, max: 60 }
        }
      });

      video.srcObject = stream;

      await new Promise((resolve) => {
        video.onloadedmetadata = resolve;
      });

      await video.play();
    }

    let lastFrameTimestamp = 0;

    function gameLoop(timestamp) {
      const deltaMs = Math.min(
        timestamp - lastFrameTimestamp || 16,
        50
      );

      lastFrameTimestamp = timestamp;

      ctx.clearRect(0, 0, window.innerWidth, window.innerHeight);

      if (
        poseLandmarker &&
        video.readyState >= HTMLMediaElement.HAVE_CURRENT_DATA &&
        video.currentTime !== lastVideoTime
      ) {
        lastVideoTime = video.currentTime;

        lastDetection = poseLandmarker.detectForVideo(
          video,
          timestamp
        );
      }

      updateTrackingText(lastDetection);
      drawOrb(timestamp);

      const rightHand = getRightIndexPosition(lastDetection);

      if (rightHand) {
        drawHand(rightHand.x, rightHand.y);
        checkOrbCollection(rightHand);
      }

      updateParticles(deltaMs);
      drawParticles();

      animationFrameId = requestAnimationFrame(gameLoop);
    }

    startButton.addEventListener("click", async () => {
      try {
        startButton.disabled = true;
        startButton.textContent = "Loading Tracking…";

        await Promise.all([
          loadPoseLandmarker(),
          startCamera()
        ]);

        resizeCanvas();
        spawnOrb();

        startScreen.classList.add("hidden");
        messageElement.textContent =
          "Collect the gold energy orb with your right hand.";

        animationFrameId = requestAnimationFrame(gameLoop);
      } catch (error) {
        console.error(error);

        startButton.disabled = false;
        startButton.textContent = "Try Camera Again";

        messageElement.textContent =
          "Camera or pose tracking failed. Allow camera access, use HTTPS or localhost, then retry.";
      }
    });

    window.addEventListener("resize", () => {
      resizeCanvas();

      if (
        orb.x > window.innerWidth ||
        orb.y > window.innerHeight
      ) {
        spawnOrb();
      }
    });

    window.addEventListener("beforeunload", () => {
      if (animationFrameId) {
        cancelAnimationFrame(animationFrameId);
      }

      const stream = video.srcObject;

      if (stream) {
        stream.getTracks().forEach((track) => track.stop());
      }
    });
  </script>
</body>
</html>
